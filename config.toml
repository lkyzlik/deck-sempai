[app]
deck_storage = "anki"
frontend = "rich"
log_level = "warning"

[commands.grammar]
da-DK = "add-grammar-ordnet"
en-GB = "skip"
en-US = "skip"
other = "add-grammar-ollama"

[commands.sound]
da-DK = "add-sound-ordnet"
other = "skip"

[commands.translate]
other = "translate-ollama"

[commands.add]
apply = [
  "translate",
  "add-sound",
  "add-grammar"
]

[integrations.anki]
enable = true
host = "localhost"
port = "8765"

[integrations.ollama]
default_model = "gemma4"
enable = true

[integrations.ordnet]
enable = true
