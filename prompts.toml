# This file contains prompts for AI transformations
#
# Placeholders in {} will be replaced with actual values when the prompt is used.
# {lang_from} - language of the input field
# {lang_to}   - language of the output field
#
# Use {{ }} to escape curly braces.

translate = "Translate the following text from {lang_from} to {lang_to}. Only return the translated text without any additional formatting or explanation."

pos = "Classify the following text in {lang_from} into one of the following categories: noun, verb, adjective, adverb, pronoun, preposition, conjunction, interjection, none. Only return the category without any additional formatting or explanation. Use 'none' if the text does not belong to any of the categories or you are unsure."

[noun.article]
da = "Return only the correct indefinite article for the word: 'en' or 'et'. Example: for 'bil' return 'en', for 'hus' return 'et'. Only return the article without any additional formatting or explanation. Return 'none' if you're unsure. Check that what you are returning is correct, only valid options are: en, et, none"

[noun.plural.indefinite]
da = "The input is a noun in Danish. Return indefinite plural suffix for the noun. Example: for 'bil' return '-er', for 'hus' return '-e'. Only return the suffix without any additional formatting or explanation. If the indefinite plural form changes the word (e.g. 'mand' -> 'mænd'), return the indefinite plural form instead of the suffix. If the plural form is the same as the singular form (e.g. 'fisk' -> 'fisk'), return '-'. Return 'none' if you're unsure."

[noun.plural.definite]
da = "The input is a noun in Danish. Return definite plural suffix for the noun. Example: for 'bil' return '-erne', for 'hus' return '-ene'. Only return the suffix without any additional formatting or explanation. If the definite plural form changes the word (e.g. 'mand' -> 'mændene'), return the definite plural form instead of the suffix. If the plural form is the same as the singular form (e.g. 'fisk' -> 'fisk'), return '-'. Return 'none' if you're unsure."

[verb.infinitive]
da = "The input is a verb in Danish, possibly in a conjugated form. Return the infinitive (navneform) of the verb, without the infinitive marker 'at'. Example: for 'spiser' return 'spise', for 'gik' return 'gå'. Only return the infinitive form without any additional formatting or explanation. Return 'none' if you're unsure."

[verb.tense.past]
da = "The input is a verb in Danish. Return the past tense (datid) form of the verb. Example: for 'gå' return 'gik', for 'spise' return 'spiste'. Only return the past tense form without any additional formatting or explanation. Return 'none' if you're unsure."

[verb.tense.present_perfect]
da = "The input is a verb in Danish. Return the present perfect tense (fornutid) form of the verb. Example: for 'gå' return 'er gået', for 'spise' return 'har spist'. Only return the present perfect tense form without any additional formatting or explanation. Return 'none' if you're unsure."
